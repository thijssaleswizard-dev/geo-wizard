services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: geo-wizard-app
    container_name: geo-wizard-app
    restart: unless-stopped
    user: "1000:1000"
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - geo-wizard-network

  webserver:
    image: nginx:alpine
    container_name: geo-wizard-webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - geo-wizard-network
    depends_on:
      - app

  queue:
    image: geo-wizard-app
    container_name: geo-wizard-queue
    restart: always
    user: "1000:1000"
    working_dir: /var/www
    volumes:
      - .:/var/www
    command: php artisan queue:work --sleep=2 --tries=3 --timeout=180 --max-time=3600 --max-jobs=1000
    networks:
      - geo-wizard-network
    depends_on:
      - app
      - db

  db:
    image: mysql:8.0
    container_name: geo-wizard-db
    restart: unless-stopped
    tty: true
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: geo_wizard
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: geo_wizard_user
      MYSQL_PASSWORD: secretpassword
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - geo-wizard-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: geo-wizard-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: geo_wizard_user
      PMA_PASSWORD: secretpassword
      UPLOAD_LIMIT: 64M
    networks:
      - geo-wizard-network
    depends_on:
      - db

networks:
  geo-wizard-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
